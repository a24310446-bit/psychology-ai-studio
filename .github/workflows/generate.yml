
name: Psychology AI Generator

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: psychology-ai-history
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v7

      - name: Set up JavaScript
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Search psychology research
        run: node generate.mjs

      - name: Save research file
        uses: actions/upload-artifact@v7
        with:
          name: psychology-research-${{ github.run_number }}
          path: output/research.json
          if-no-files-found: error
          retention-days: 30

      - name: Save used topic history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add history/used_topics.json

          if git diff --cached --quiet; then
            echo "No new history to save"
          else
            git commit -m "Save used psychology topic"
            git push origin HEAD:main
          fi
